name: Coleta Trindade

# Cada execução fica ligada por até ~5h40 e atualiza os dados a cada 5 minutos.
# Os horários abaixo só servem para (re)iniciar a coleta: se uma execução já estiver
# rodando, a nova fica na fila e começa assim que a anterior terminar.
on:
  schedule:
    - cron: "*/15 7-23 * * *"   # 04h00 às 20h45 (Brasília)
    - cron: "*/15 0-3 * * *"    # 21h00 às 00h45 (Brasília)
  workflow_dispatch:

# Ações de terceiros fixadas pelo commit (SHA): uma tag alterada por invasor não entra aqui. Permissões só as necessárias.
permissions:
  contents: write   # grava os dados criptografados no ramo "dados"
  pages: write      # publica o site
  id-token: write   # exigido pela publicação do GitHub Pages

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
    env:
      INLOG_USUARIO: ${{ secrets.INLOG_USUARIO }}
      INLOG_SENHA: ${{ secrets.INLOG_SENHA }}
      SENHA_SITE: ${{ secrets.SENHA_SITE }}
      SENHA_SITE_ANTIGA: ${{ secrets.SENHA_SITE_ANTIGA }}   # só durante a troca da senha do site (apague depois)
      LOG_DETALHADO: ${{ vars.LOG_DETALHADO }}             # 1 = log com detalhes (o log é público: use por pouco tempo)
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fora do horário de coleta?
        id: hora
        run: |
          h=$(TZ=America/Sao_Paulo date +%H%M)
          if [ "$h" -ge 0200 ] && [ "$h" -lt 0350 ]; then echo "fora=1" >> "$GITHUB_OUTPUT"; echo "Fora do horário ($h)"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.hora.outputs.fora != '1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.hora.outputs.fora != '1'
        with:
          python-version: "3.12"
      - if: steps.hora.outputs.fora != '1'
        run: pip install requests==2.32.3 cryptography==43.0.3
      - name: Primeira coleta
        if: steps.hora.outputs.fora != '1'
        run: python coletor/coletor.py || echo "primeira coleta falhou" 
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.hora.outputs.fora != '1'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.hora.outputs.fora != '1'
        with:
          path: docs
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: steps.hora.outputs.fora != '1'
      - name: Coletar dados da INLOG (a cada 5 min)
        if: steps.hora.outputs.fora != '1'
        run: |
          publicar() {
            rm -rf /tmp/pub
            git clone -q --depth 1 -b dados "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pub 2>/dev/null || mkdir -p /tmp/pub
            rm -rf /tmp/pub/.git && mkdir -p /tmp/pub/hist
            cp docs/dados.enc.json /tmp/pub/ && cp docs/hist/* /tmp/pub/hist/ 2>/dev/null
            mkdir -p /tmp/pub/c && cp -r docs/c/. /tmp/pub/c/ 2>/dev/null
            python3 -c "import json,os,glob;[os.remove(f) for ix in glob.glob('/tmp/pub/hist/index.json')+glob.glob('/tmp/pub/c/*/hist/index.json') for d in [json.load(open(ix))['dias']] for f in glob.glob(os.path.dirname(ix)+'/*.enc.json') if os.path.basename(f)[:10] not in d]" 2>/dev/null
            cd /tmp/pub && git init -q && git add . \
              && git -c user.name=coletor -c user.email=coletor@users.noreply.github.com commit -qm "dados $(TZ=America/Sao_Paulo date +%H:%M)" \
              && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:dados
            cd "$GITHUB_WORKSPACE"
          }
          publicar || echo "falha ao publicar"
          fim=$((SECONDS + 20100))   # ~5h35
          while [ $SECONDS -lt $fim ]; do
            sleep $((300 - $(date +%s) % 300))
            h=$(TZ=America/Sao_Paulo date +%H%M)
            if [ "$h" -ge 0200 ] && [ "$h" -lt 0350 ]; then echo "Fim do horário de coleta"; break; fi
            git pull -q --ff-only origin main || true   # usa sempre a versão mais nova do coletor
            if (python coletor/coletor.py); then publicar || echo "falha ao publicar"; else echo "coleta falhou, tento de novo em 5 min"; fi
          done
