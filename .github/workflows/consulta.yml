name: Consulta de endereços

# Monta a consulta de endereços das cidades (setores, dias e horário em cada rua)
# a partir dos mapas dos setores e do GPS da INLOG e das ruas do OpenStreetMap.
# Cada cidade roda separada e é salva assim que fica pronta (uma cidade grande não segura as outras).
# Roda no dia 1 de cada mês, quando o script ou o cadastro das cidades mudam,
# e pelo botão "Run workflow" (dá para escolher as cidades).
on:
  schedule:
    - cron: "23 9 1 * *"   # dia 1, 06h23 (Brasília)
  push:
    branches: [main]
    paths: ["coletor/consulta.py", "coletor/cidades.json"]
  workflow_dispatch:
    inputs:
      cidades:
        description: "Cidades separadas por espaço (ex.: anapolis jatai). Vazio = todas."
        required: false
        default: ""

# Ações de terceiros fixadas pelo commit (SHA). Cada job só recebe as permissões de que precisa.
permissions:
  contents: read

concurrency:
  group: consulta
  cancel-in-progress: false

jobs:
  lista:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cidades: ${{ steps.l.outputs.cidades }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: l
        env:
          PEDIDAS: ${{ github.event.inputs.cidades }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          C = json.load(open("coletor/cidades.json"))
          todas = [c for c in C if not C[c].get("cad")]
          pedidas = [c for c in os.environ.get("PEDIDAS", "").split() if c in todas]
          print("cidades=" + json.dumps(pedidas or todas))
          EOF

  montar:
    needs: lista
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # salva a consulta no repositório
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        cidade: ${{ fromJSON(needs.lista.outputs.cidades) }}
    env:
      INLOG_USUARIO: ${{ secrets.INLOG_USUARIO }}
      INLOG_SENHA: ${{ secrets.INLOG_SENHA }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 cryptography==43.0.3 shapely==2.0.6
      - name: Montar a consulta (${{ matrix.cidade }})
        run: python coletor/consulta.py ${{ matrix.cidade }}
      - name: Salvar no repositório
        run: |
          git config user.name coletor
          git config user.email coletor@users.noreply.github.com
          git add docs/c/${{ matrix.cidade }}/consulta_dados.json
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git commit -qm "Consulta: ${{ matrix.cidade }} ($(TZ=America/Sao_Paulo date +%d/%m))"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((10 + RANDOM % 20))
          done
          exit 1

  publicar:
    # publica o site já com a consulta nova (a coleta também publica ao reiniciar)
    needs: montar
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true
